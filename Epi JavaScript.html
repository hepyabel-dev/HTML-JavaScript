<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tugas JavaScript</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            max-width: 800px;
            margin: 30px auto;
            padding: 25px;
            line-height: 1.5;
        }

        h1 {
            text-align: center;
            color: darkblue;
            margin-bottom: 25px;
        }

        h2 {
            color: #333;
            margin-top: 20px;
        }

        img {
            display: block;
            margin: 10px auto 15px;
            width: 240px;
            height: 240px;
            object-fit: cover;
            border-radius: 8px;
        }

        label {
            display: inline-block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            border-color: #666;
            outline: none;
        }

        button {
            padding: 8px 15px;
            margin-top: 8px;
            border: 1px solid #888;
            border-radius: 4px;
            background-color: #e9e9e9;
            color: #333;
            cursor: pointer;
        }

        button:hover {
            background-color: #dcdcdc;
        }

        #choiceInputs {
            margin-top: 15px;
        }

        #choiceInputs div {
            margin-bottom: 8px;
        }

        #radioContainer {
            margin-top: 10px;
        }

        #radioContainer label {
            display: block;
            margin: 7px 0;
        }

        #radioContainer input[type="radio"] {
            margin-right: 6px;
        }

        #emailError {
            color: red;
            font-weight: bold;
        }

        #hasilAkhir {
            background-color: white;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }

        hr {
            margin: 25px 0;
            border: none;
            border-top: 1px solid #ccc;
        }
    </style>
</head>

<body>

    <h1>Tugas JavaScript</h1>

    <h2>Identitas</h2>

    <img src="FotoAku.jpeg.jpeg" alt="Foto Epi" width="200">

    <p>Nama : Epi</p>
    <p>NIM  : 255314047</p>

    <hr>

    <h2>Data Pilihan</h2>

    <label for="nama">Nama:</label>
    <input type="text" id="nama">

    <br><br>

    <label for="jumlah">Jumlah Pilihan:</label>
    <input type="number" id="jumlah" min="1" max="10">

    <br><br>

    <button id="btnJumlah">OK</button>

    <div id="choiceInputs"></div>

    <br>

    <button id="btnSimpanPilihan">
        Simpan Pilihan
    </button>

    <hr>

    <h2>Pilihan</h2>

    <div id="radioContainer"></div>

    <br>

    <label for="dropdown">Atau pilih dari Drop Down:</label>

    <br><br>

    <select id="dropdown"></select>

    <br><br>

    <button id="btnPilihanFinal">
        OK
    </button>

    <hr>

    <h2>Email</h2>

    <label for="email">Email:</label>

    <input
        type="email"
        id="email"
        placeholder="contoh@email.com"
    >

    <br><br>

    <button id="btnEmail">
        OK
    </button>

    <p id="emailError"></p>
    <p id="hasilAkhir"></p>

    <script>
        // Event controler tombol OK
        document
            .getElementById("btnJumlah")
            .addEventListener("click", buatInputPilihan);

        // Fungsi membuat input pilihan menggunakan loop
        function buatInputPilihan() {
            
            const jumlah = Number(
                document.getElementById("jumlah").value
            );
            
            const container = 
                document.getElementById("choiceInputs");

        // Mengosongkan pilihan sebelumnnya 
        container.innerHTML = "";
        
        // Error handling jumlah pilihan
        if (!Number.isInteger(jumlah) || jumlah < 1 || jumlah > 10) {

            alert(
                "Jumlah pilihan harus berupa bilangan bulat 1 sampai 10."
            );

            return;
        }

        // Loop membuat input jumlah pilihan
            for (let i = 0; i < jumlah; i++) {
                
                const div = document.createElement("div");

                const label = document.createElement("label");

                label.textContent =
                    "Pilihan " + (i + 1) + " : ";


                const input = document.createElement("input");

                input.type = "text";

                input.id = "pilihan" + i;


                div.appendChild(label);

                div.appendChild(input);

                container.appendChild(div);

                container.appendChild(
                    document.createElement("br")
                );
            }
        }

        // Event controller tombol Simpan Pilihan
        document
            .getElementById("btnSimpanPilihan")
            .addEventListener("click", simpanPilihan);

        document
            .getElementById("btnPilihanFinal")
            .addEventListener("click", cekPilihan);
        
        document
            .getElementById("btnEmail")
            .addEventListener("click", prosesEmail);
        
        // Fungsi cek pilihan
        function cekPilihan() {

            const radioTerpilih =
                document.querySelector(
                    'input[name="pilihanRadio"]:checked'
                );

            const pilihanDropdown =
                document.getElementById("dropdown").value;


            if (!radioTerpilih) {

                alert(
                    "Silakan pilih salah satu pilihan."
                );

                return;
            }

            console.log(
                "Pilihan Radio:",
                radioTerpilih.value
            );

            console.log(
                "Pilihan Drop Down:",
                pilihanDropdown
            );

            alert(
                "Pilihan berhasil ditetapkan."
            );
        }

        // Fungsi Email
        function prosesEmail() {

            const emailInput =
                document.getElementById("email");

            const emailError =
                document.getElementById("emailError");

            const email =
                emailInput.value.trim();

            emailError.textContent = "";


        // Pattern matching email
            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        // Error handling email
            if (!emailPattern.test(email)) {

                alert(
                    "Format email tidak valid. Silakan masukkan email dengan benar."
                );

                emailError.textContent =
                    "Contoh format yang benar: nama@email.com";

                emailInput.focus();

                return;
            }


            alert(
                "Email berhasil diterima."
            );

            console.log(
                "Email:",
                email
            );
            
            const nama = document.getElementById("nama").value.trim();
            const jumlah = pilihanArray.length;

            const radioTerpilih = document.querySelector(
                'input[name="pilihanRadio"]:checked'
            );

            const pilihanDipilih = radioTerpilih.value;

            const hasil = document.getElementById("hasilAkhir");

            hasil.textContent =
                "Hallo, nama saya " +
                nama +
                ", email " +
                email +
                " saya mempunyai sejumlah " +
                jumlah +
                " pilihan yaitu " +
                pilihanArray.join(", ") +
                ", dan saya memilih " +
                pilihanDipilih +
                ".";
        }
        // Fungsi menyimpan teks pilihan ke array
        function simpanPilihan() {

            pilihanArray = [];

            const jumlah = Number(
                document.getElementById("jumlah").value
            );

        // Membuat radio button dari array
        function buatRadioButton() {

            const container =
                document.getElementById("radioContainer");

            container.innerHTML = "";

            for (let i = 0; i < pilihanArray.length; i++) {

                const label =
                    document.createElement("label");

                const radio =
                    document.createElement("input");

                radio.type = "radio";
                radio.name = "pilihanRadio";
                radio.value = pilihanArray[i];

                if (i === 0) {
                    radio.checked = true;
                }

                label.appendChild(radio);

                label.appendChild(
                    document.createTextNode(
                        " " + pilihanArray[i]
                    )
                );

                container.appendChild(label);

                container.appendChild(
                    document.createElement("br")
                );
            }
        }

        // Membuat drop down dari array
        function buatDropdown() {

            const dropdown =
                document.getElementById("dropdown");

            dropdown.innerHTML = "";

            for (let i = 0; i < pilihanArray.length; i++) {

                const option =
                    document.createElement("option");

                option.value = pilihanArray[i];

                option.textContent =
                    pilihanArray[i];

                dropdown.appendChild(option);
            }
        }

        // Loop mengambil setiap teks pilihan
        for (let i = 0; i < jumlah; i++) {

            const input =
                document.getElementById("pilihan" + i);

            const teksPilihan =
                input.value.trim();

        // Error handling jika pilihan kosong
        if (teksPilihan === "") {

                alert(
                    "Pilihan " + (i + 1) + " belum diisi."
                );

                input.focus();

                return;
            }    

        // Memasukkan teks ke array
        pilihanArray.push(teksPilihan);
    }


        // Menampilkan array di Console
        console.log(
            "Array pilihan:",
            pilihanArray
        );

        alert(
            "Pilihan berhasil disimpan ke dalam array."
        );

        buatRadioButton();
        buatDropdown();
    }
</script>

</body>

</html>

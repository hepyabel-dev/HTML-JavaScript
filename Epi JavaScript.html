<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tugas 4 - JavaScript</title>
</head>

<body>

    <h1>Tugas 4 - JavaScript</h1>

    <h2>Identitas</h2>

    <img src="FotoAku.jpeg.jpeg" alt="Foto Epi" width="200">

    <p>Nama: Epi</p>
    <p>NIM: 255314047</p>

    <hr>

    <h2>Data Pilihan</h2>

    <label for="nama">Nama:</label>
    <input type="text" id="nama">

    <br><br>

    <label for="jumlah">Jumlah Pilihan:</label>
    <input type="number" id="jumlah" min="1" max="10">

    <br><br>

    <button id="btnJumlah">OK</button>

    <div id="choiceInputs"></div>

    <script>
        document.getElementById("btnJumlah").addEventListener("click", buatInputPilihan);

        function buatInputPilihan() {
            const jumlah = Number(document.getElementById("jumlah").value);
            const container = document.getElementById("choiceInputs");

            container.innerHTML = "";

            for (let i = 0; i < jumlah; i++) {
                const label = document.createElement("label");
                label.textContent = "Pilihan " + (i + 1) + " : ";

                const input = document.createElement("input");
                input.type = "text";
                input.id = "pilihan" + i;

                const div = document.createElement("div");

                div.appendChild(label);
                div.appendChild(input);

                container.appendChild(div);
                container.appendChild(document.createElement("br"));
            }
        }
    </script>

</body>

</html>
